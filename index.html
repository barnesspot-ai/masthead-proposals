<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposals | Masthead Financial Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#222a3e;--orange:#f78f1e;--silver:#a7b8bc;
  --grey:#e5e5e5;--white:#ffffff;--page:#f4f5f7;
  --ink:#1a1f2e;--ink-soft:#6b7590;--rule:#dde2e8;
}
body{font-family:'Barlow',sans-serif;font-weight:300;background:var(--page);color:var(--ink);min-height:100vh}
nav{background:var(--navy);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 48px}
.nav-brand{font-weight:600;font-size:14px;color:var(--white);letter-spacing:0.08em;text-transform:uppercase}
.nav-brand span{font-weight:300;color:var(--silver);margin-left:6px;font-size:13px;letter-spacing:0.04em;text-transform:none}
.nav-tag{background:rgba(247,143,30,0.15);border:1px solid rgba(247,143,30,0.35);color:var(--orange);font-size:11px;letter-spacing:0.10em;text-transform:uppercase;padding:4px 12px;border-radius:2px}
main{max-width:900px;margin:0 auto;padding:64px 48px}
.page-label{font-size:10px;letter-spacing:0.20em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
.page-title{font-family:'Playfair Display',serif;font-size:36px;font-weight:400;color:var(--navy);margin-bottom:10px}
.page-rule{width:40px;height:2px;background:var(--orange);margin-bottom:36px}
.proposal-grid{display:flex;flex-direction:column;gap:14px}
.proposal-card{
  background:var(--white);border:1px solid var(--rule);border-radius:6px;
  padding:22px 28px;display:flex;align-items:center;justify-content:space-between;
  text-decoration:none;transition:border-color 0.2s,box-shadow 0.2s;
}
.proposal-card:hover{border-color:var(--navy);box-shadow:0 2px 12px rgba(34,42,62,0.08)}
.card-left{}
.card-client{font-family:'Playfair Display',serif;font-size:20px;color:var(--navy);margin-bottom:4px}
.card-meta{font-size:13px;color:var(--ink-soft);display:flex;gap:16px}
.card-meta span{display:flex;align-items:center;gap:4px}
.card-dot{width:6px;height:6px;border-radius:50%;background:var(--silver);display:inline-block}
.card-status{
  font-size:11px;letter-spacing:0.10em;text-transform:uppercase;
  padding:4px 10px;border-radius:2px;font-weight:400;
}
.status-draft{background:var(--grey);color:var(--ink-soft)}
.status-review{background:rgba(247,143,30,0.12);color:#7a4200;border:1px solid rgba(247,143,30,0.25)}
.status-live{background:rgba(34,42,62,0.08);color:var(--navy);border:1px solid rgba(34,42,62,0.15)}
.card-arrow{color:var(--silver);font-size:18px;margin-left:20px}
.proposal-card:hover .card-arrow{color:var(--orange)}
footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between}
@media(max-width:600px){nav{padding:0 20px}main{padding:40px 20px}.proposal-card{flex-direction:column;align-items:flex-start;gap:14px}}
</style>
</head>
<body>
<nav>
  <div class="nav-brand">Masthead <span>Financial Planning</span></div>
  <div class="nav-tag">Proposals</div>
</nav>
<main>
  <div class="page-label">Advisory OS</div>
  <div class="page-title">Client Proposals</div>
  <div class="page-rule"></div>
  <div class="proposal-grid">

    <a class="proposal-card" href="/proposal/marc-barnes">
      <div class="card-left">
        <div class="card-client">Marc Barnes</div>
        <div class="card-meta">
          <span><span class="card-dot"></span>i2 Growth Solutions</span>
          <span>Moderately Aggressive</span>
          <span>May 2026</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="card-status status-review">Adviser Review</span>
        <span class="card-arrow">→</span>
      </div>
    </a>

    <a class="proposal-card" href="/proposal/demo-client">
      <div class="card-left">
        <div class="card-client">Demo Client</div>
        <div class="card-meta">
          <span><span class="card-dot"></span>Template Proposal</span>
          <span>Moderate</span>
          <span>May 2026</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="card-status status-draft">Draft</span>
        <span class="card-arrow">→</span>
      </div>
    </a>

  </div>
  <footer>
    <span>Masthead Financial Planning &nbsp;·&nbsp; Advisory OS</span>
    <span>Adviser use only — confidential</span>
  </footer>
</main>
</body>
</html>
